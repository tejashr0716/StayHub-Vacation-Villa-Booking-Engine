syntax = "proto3";

package stayhub.v1;

option go_package = "github.com/tejashr0716/StayHub-Vacation-Villa-Booking-Engine/proto/stayhubv1";

service StayHubService {
  rpc AcquireLock (AcquireLockRequest) returns (AcquireLockResponse);
  rpc ReleaseLock (ReleaseLockRequest) returns (ReleaseLockResponse);
  rpc StreamTelemetry (TelemetryStreamRequest) returns (stream TelemetryEvent);
  rpc QueryHealth (HealthCheckRequest) returns (HealthCheckResponse);
}

message AcquireLockRequest {
  string resource_id = 1;
  int32 duration_seconds = 2;
  string caller_id = 3;
  string region = 4;
}

message AcquireLockResponse {
  bool success = 1;
  string lease_id = 2;
  int64 expires_at_timestamp = 3;
  string error_code = 4;
}

message ReleaseLockRequest {
  string resource_id = 1;
  string lease_id = 2;
}

message ReleaseLockResponse {
  bool released = 1;
  int64 release_timestamp = 2;
}

message TelemetryStreamRequest {
  string client_id = 1;
  int32 sample_rate_ms = 2;
}

message TelemetryEvent {
  string event_id = 1;
  int64 timestamp = 2;
  double p50_latency = 3;
  double p99_latency = 4;
  int32 active_leases = 5;
  string system_status = 6;
}

message HealthCheckRequest {
  string service_name = 1;
}

message HealthCheckResponse {
  string status = 1;
  int64 uptime_seconds = 2;
  double cpu_usage_pct = 3;
  int64 memory_heap_bytes = 4;
}
