# Modern Nginx / Caddy HTTP/3 (QUIC) Ingress Configuration for StayHub-Vacation-Villa-Booking-Engine
server {
    listen 443 quic reuseport;
    listen 443 ssl http2;
    server_name api.stayhub.io;

    # TLS 1.3 Strict Ciphers with 0-RTT Early Data
    ssl_protocols TLSv1.3;
    ssl_early_data on;
    ssl_prefer_server_ciphers off;

    # HTTP/3 QUIC Headers & Alt-Svc Advertisement
    add_header Alt-Svc 'h3=":443"; ma=86400, h3-29=":443"; ma=86400';
    add_header QUIC-Status $http3;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    location /v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
