# Linux Kernel Extreme Performance & BBR Congestion Control for StayHub-Vacation-Villa-Booking-Engine
# Network Socket Queue Depth & Epoll Concurrency
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.core.netdev_max_backlog = 32768
net.ipv4.ip_local_port_range = 1024 65535

# Google BBR (Bottleneck Bandwidth and RTT) Congestion Control
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# TCP Buffer Autotuning (Sub-millisecond high-bandwidth throughput)
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# Socket Lifecycle & TIME_WAIT Recycle
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_fastopen = 3

# File Descriptors Limits (100k+ simultaneous WebSocket clients)
fs.file-max = 2097152
fs.nr_open = 2097152
