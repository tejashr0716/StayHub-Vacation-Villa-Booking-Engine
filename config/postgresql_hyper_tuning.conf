# PostgreSQL Hyper-Tuned Bare-Metal NVMe Storage Configuration for StayHub-Vacation-Villa-Booking-Engine
# System Sizing: 64GB RAM, 16 vCPU, PCIe 4.0 NVMe SSD Storage

# Memory & Buffer Cache Allocation
shared_buffers = 16GB                  # 25% Total RAM for shared buffer pool
effective_cache_size = 48GB            # 75% Total RAM for OS + Postgres cache
work_mem = 64MB                        # High memory for complex in-memory hash joins
maintenance_work_mem = 2GB             # High speed index builds and VACUUM
wal_buffers = 64MB                     # Maximum write-ahead log buffer size

# Storage & NVMe Access Optimization
random_page_cost = 1.1                 # NVMe random access cost virtually identical to sequential (1.0)
effective_io_concurrency = 256         # Asynchronous prefetching for NVMe SSD arrays
default_statistics_target = 500        # Deep planner statistics to enforce optimal index scans

# Write-Ahead Log (WAL) & Checkpoint Hyper-Tuning
synchronous_commit = off               # Zero-disk-wait async transactional writes
checkpoint_completion_target = 0.9     # Spread checkpoint I/O smoothly over full cycle
min_wal_size = 4GB
max_wal_size = 64GB
wal_compression = zstd                 # Modern zstd WAL compression saving 70% disk IOPS

# Parallel Execution Engine
max_worker_processes = 16
max_parallel_workers = 16
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# Covering Index & Query Plan Enforcement
enable_seqscan = off                   # Strongly favor index and index-only scans
enable_bitmapscan = on
enable_indexscan = on
enable_hashjoin = on
