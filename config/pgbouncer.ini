; High-Throughput PgBouncer Pool Configuration for StayHub-Vacation-Villa-Booking-Engine
[databases]
stayhub_primary = host=127.0.0.1 port=5432 dbname=stayhub_db auth_user=postgres

[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 80
min_pool_size = 25
reserve_pool_size = 15
max_client_conn = 10000
max_db_connections = 120
pkt_buf = 4096
tcp_defer_accept = 1
tcp_socket_buffer = 0
